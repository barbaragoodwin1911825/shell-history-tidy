[project]
name = "histfmt"
version = "0.1.0"
description = "Normalise messy shell history files into a readable or JSON stream"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "barbaragoodwin1911825" }]

[project.scripts]
histfmt = "histfmt.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["histfmt*"]
